<!DOCTYPE html>
<html>
<head>
    <title>Juego de Bolitas</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #eeeeee;
        }

        #juego {
            width: 600px;
            height: 400px;
            border: 3px solid black;
            margin: auto;
            position: relative;
            background-color: lightblue;
        }

        #bolita {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎯 Atrapa la bolita</h1>

    <h2>Puntos: <span id="puntos">0</span></h2>

    <h3>
        Click: x<span id="multiplicador">1</span>
    </h3>

    <h3>
        Nivel de mejora: <span id="nivel">0</span>
    </h3>

    <button onclick="comprarMejora()">
        Comprar mejora - <span id="precio">25</span> puntos
    </button>

    <div id="juego">
        <div id="bolita"></div>
    </div>


    <script>

        let puntos = 0;

        let nivel = 0;

        let multiplicador = 1;

        let precio = 25;


        const bolita = document.getElementById("bolita");

        const marcador = document.getElementById("puntos");

        const textoMultiplicador =
            document.getElementById("multiplicador");

        const textoNivel =
            document.getElementById("nivel");

        const textoPrecio =
            document.getElementById("precio");


        // CLICK EN LA BOLITA
        bolita.addEventListener("click", function() {

            puntos = puntos + multiplicador;

            actualizar();

            let x = Math.random() * 550;
            let y = Math.random() * 350;

            bolita.style.left = x + "px";
            bolita.style.top = y + "px";

        });


        // COMPRAR MEJORA
        function comprarMejora() {

            if (puntos >= precio) {

                // Quitar puntos
                puntos = puntos - precio;

                // Subir nivel
                nivel = nivel + 1;

                // Aumentar multiplicador
                multiplicador = multiplicador + 1;

                // Aumentar precio
                precio = precio * 2;

                actualizar();

            } else {

                alert("No tienes suficientes puntos 💀");

            }
        }


        // ACTUALIZAR PANTALLA
        function actualizar() {

            marcador.textContent = puntos;

            textoNivel.textContent = nivel;

            textoMultiplicador.textContent = multiplicador;

            textoPrecio.textContent = precio;

        }

    </script>

</body>
</html>
